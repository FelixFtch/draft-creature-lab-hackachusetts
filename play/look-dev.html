<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Look Lab (dev)</title>
    <style>
      :root {
        --ink: #2b2622; --muted: #7a6f63; --paper: #fbf6ee; --card: rgba(255, 252, 246, 0.9);
        --line: rgba(80, 60, 40, 0.14); --coral: #ff7a52; --blue: #1d4f8f;
        color-scheme: light;
      }
      * { box-sizing: border-box; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #efe4d2; color: var(--ink);
        font: 14px/1.35 "Inter", "Helvetica Neue", Arial, sans-serif; }
      #stage { position: fixed; inset: 0; }
      #stage canvas { display: block; width: 100%; height: 100%; }
      .panel { position: fixed; left: 16px; top: 16px; width: 316px; max-height: calc(100% - 32px); overflow: auto;
        background: var(--card); backdrop-filter: blur(10px); border: 1px solid var(--line); border-radius: 18px;
        box-shadow: 0 10px 40px rgba(60, 40, 20, 0.12); padding: 16px; }
      .panel h1 { margin: 0 0 2px; font-size: 18px; letter-spacing: -0.01em; }
      .panel .sub { margin: 0 0 12px; color: var(--muted); font-size: 12px; }
      .label { margin: 14px 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      .row { display: flex; flex-wrap: wrap; gap: 6px; }
      button { font: inherit; border: 1px solid var(--line); background: #fff; color: var(--ink); border-radius: 999px;
        padding: 6px 11px; cursor: pointer; transition: transform 0.08s, background 0.15s; }
      button:hover { transform: translateY(-1px); }
      button[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
      button.primary { background: var(--coral); color: #fff; border-color: transparent; font-weight: 600; }
      .presets { display: grid; grid-template-columns: repeat(2, 1fr); gap: 6px; }
      .preset { display: flex; align-items: center; gap: 8px; border-radius: 12px; padding: 7px 9px; text-align: left; }
      .chip { width: 22px; height: 22px; border-radius: 50%; flex: none; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.12); }
      .preset span { font-size: 12.5px; font-weight: 600; }
      .stats { position: fixed; right: 16px; bottom: 16px; font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
        color: var(--muted); background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 6px 9px; }
      .caption { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); padding: 8px 14px; border-radius: 999px;
        background: rgba(43, 38, 34, 0.86); color: #fff; font-size: 13px; letter-spacing: 0.01em; pointer-events: none; }
      .tag { position: absolute; transform: translate(-50%, 0); padding: 3px 9px; border-radius: 999px; background: rgba(255, 252, 246, 0.92);
        border: 1px solid var(--line); font-size: 12px; font-weight: 700; white-space: nowrap; pointer-events: none; color: var(--ink); }
      .tag i { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
      body.shot .panel, body.shot .stats { display: none; }
      body.blueprint .tag { background: rgba(16, 52, 102, 0.85); color: #eef6ff; border-color: rgba(238, 246, 255, 0.5); }
    </style>
  </head>
  <body>
    <div id="stage"></div>
    <div id="tags"></div>
    <script type="module" src="/src/appearance/dev-main.js"></script>
  </body>
</html>
