# mesh.yaml - elliptical hub for the multileg template, lofted along Z.
# Semi-axes hub_a (forward, = body_radius * body_aspect) and hub_b (= body_radius).
# Profile follows the Flower hub: bevelled bottom, straight wall, bevelled top, with
# section heights as fractions of hub_thickness (0.66 * body_radius, capped).
# 40 vertices per section; constants are cos/sin of 9-degree steps times the
# section scale. Generated once and kept declarative (no trig in Draft expressions).
