# Six truly independent three-hinge branches. Positive local Y pitch folds radially outward links down.
name: torso_link
type: root
color: ${torso_color}
pos:
- 0
- 0
- ${upper_leg_length + lower_leg_length + foot_sphere_r + 0.05}
sites:
- name: imu
  pos:
  - 0
  - 0
  - 0
sensors:
- type: gyro
  name: imu_ang_vel
  site: imu
- type: velocimeter
  name: imu_lin_vel
  site: imu
- type: accelerometer
  name: imu_lin_acc
  site: imu
children:
- for_each: ${legs}
  as: leg
  node:
    name: ${leg.name}_mount
    type: basic
    pos:
    - ${leg.dx * hub_mount_radius}
    - ${leg.dy * hub_mount_radius}
    - 0
    euler:
    - 0
    - 0
    - ${leg.yaw}
    geometry:
      link_axis: x
      link_l: ${mount_link_length}
      link_r: ${mount_link_r}
      motor_axis: z
      motor_class: ${hip_yaw_mot}
      motor_for: hip_yaw
    children:
    - name: ${leg.name}_yaw_link
      type: basic
      pos:
      - ${mount_link_length}
      - 0
      - 0
      joint:
        name: ${leg.name}_hip_yaw
        axis: z
        range: ${hip_yaw_range}
        motor_class: ${hip_yaw_mot}
      geometry:
        link_axis: x
        link_l: ${coxa_length}
        link_r: ${coxa_link_r}
        motor_axis: y
        motor_class: ${hip_pitch_mot}
        motor_for: hip_pitch
      children:
      - name: ${leg.name}_upper_leg_link
        type: basic
        pos:
        - ${coxa_length}
        - 0
        - 0
        joint:
          name: ${leg.name}_hip_pitch
          axis: y
          range: ${hip_pitch_range}
          motor_class: ${hip_pitch_mot}
        geometry:
          link_axis: x
          link_l: ${upper_leg_length}
          link_r: ${upper_leg_r}
          motor_axis: y
          motor_class: ${knee_mot}
          motor_for: knee
        children:
        - name: ${leg.name}_lower_leg_link
          type: sphere
          pos:
          - ${upper_leg_length}
          - 0
          - 0
          joint:
            name: ${leg.name}_knee
            axis: y
            range: ${knee_range}
            motor_class: ${knee_mot}
          geometry:
            link_axis: x
            link_l: ${lower_leg_length}
            link_r: ${lower_leg_r}
            sphere_dir: 1
            sphere_r: ${foot_sphere_r}
            sphere_rho: ${foot_rho}
            sphere_color: ${foot_color}
            friction:
            - 0.8
            - 0.005
            - 0.0001
          sites:
          - name: ${leg.name}_foot
            pos:
            - ${lower_leg_length}
            - 0
            - 0
